name: Sync Upstream

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync author repository
        run: |
          set -e

          git remote add upstream https://github.com/Aoluis1005/QQ-farm-BOT-GO.git || true
          git fetch upstream master

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git merge upstream/master --no-edit -X ours
          git push origin main
